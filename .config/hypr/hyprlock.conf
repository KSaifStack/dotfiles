 background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25 # Size of input password dots
    dots_spacing = 0.35 # Spacing between dots
    dots_center = true
    
    # Theme Colors (Deep dark backgrounds with clean borders)
    outer_color = rgba(26, 27, 38, 0.6) # Subtle, translucent dark border
    inner_color = rgba(16, 16, 26, 0.8) # Deep dark input box
    font_color = rgb(192, 202, 245)     # Clean, readable text/dot color
    fail_color = rgb(247, 118, 142)     # Smooth red if password is wrong
    
    fade_on_empty = true
    fade_timeout = 1000
    
    # Nerd Font styling for the placeholder text
    placeholder_text = <span foreground="##787c99">󰌾  Enter Password...</span>
    hide_input = false
    
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}

general {
    hide_cursor = true
    ignore_empty_input = true
    disable_loading_bar = true
}

label {
    monitor =
    # Pulls the "PRETTY_NAME" field (e.g., "Arch Linux" or "Fedora Linux") from os-release
    text = cmd[update:0] echo "  $(awk -F= '/^PRETTY_NAME/{gsub(/"/, "", $2); print $2}' /etc/os-release)"
    color = rgba(192, 202, 245, 0.6)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}

